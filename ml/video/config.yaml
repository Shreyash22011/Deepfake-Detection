# ml/video/config.yaml

# Preprocessing Configuration
preprocessing:
  target_fps: 5              # Downsample video to this FPS
  max_frames: 30             # Maximum frames to extract per video
  image_size: [224, 224]     # Target dimension (width, height)
  face_margin: 0.2           # Margin around face bounding box

# Model Architecture Configuration
model:
  backbone_name: "resnet18"  # "resnet18" or "efficientnet_b0"
  hidden_size: 256           # Temporal model hidden size
  num_layers: 2              # Temporal model layers
  dropout: 0.5               # Dropout for LSTM/Classifier

# Training Configuration
training:
  batch_size: 8
  learning_rate: 0.0001
  epochs: 10
  device: "auto"             # "auto", "cuda", or "cpu"

# Inference Configuration
inference:
  suspicious_threshold: 0.5  # Threshold for marking a frame as fake/suspicious
